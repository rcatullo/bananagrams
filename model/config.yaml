model:
  image_encoder:
    backbone: "resnet50"
    pretrained: true
    freeze: true
    
  text_encoder:
    model_name: "ViT-B/32"  # CLIP model variant
    freeze: true
    
  # Cross-attention fusion
  fusion:
    hidden_dim: 256  # Dimension for cross-attention
    num_layers: 2  # Number of cross-attention layers
    num_heads: 8  # Number of attention heads
    dropout: 0.2
    
  decoder:
    base_channels: 32  # Reduced from 64
    use_skip_connections: true
    dropout: 0.2  # Dropout for decoder blocks

training:
  batch_size: 64  # Adjust based on GPU memory
  num_epochs: 50
  learning_rate: 5.0e-5
  weight_decay: 1.0e-3 
  optimizer: "adamw"  # adamw, adam, sgd
  
  lr_scheduler: "cosine"  # cosine, step, plateau, none
  warmup_epochs: 5
  min_lr: 1.0e-6
  
  use_amp: true  # Automatic Mixed Precision for faster training
  
  max_grad_norm: 1.0  # Gradient clipping
  
  val_every_n_epochs: 1
  
  checkpoint_dir: "checkpoints"
  save_every_n_epochs: 5
  keep_last_n_checkpoints: 3
  save_best_only: true  # Save best model by validation IoU

loss:
  bce_weight: 0.5  # Binary cross-entropy weight
  dice_weight: 1.5  # Dice loss weight
  
data:
  image_size: 512  # Input resolution (square images)
  normalize_mean: [0.485, 0.456, 0.406]  # ImageNet normalization
  normalize_std: [0.229, 0.224, 0.225]
  
  # HuggingFace dataset configuration
  dataset_name: "BryanW/HumanEdit"  # HuggingFace dataset identifier
  train_split: "train"  # Split name for training
  val_split: "validation"  # Split name for validation (or "val" if available)
  test_split: "test"  # Split name for testing
  
  # Dataset sizes (will be auto-detected from dataset, but can be overridden)
  # num_train_samples: null  # Auto-detect from dataset length
  # num_val_samples: null  # Auto-detect from dataset length
  # num_test_samples: null  # Auto-detect from dataset length
  
  num_workers: 4
  prefetch_factor: 4
  pin_memory: true
  
  augmentation:
    enabled: false
    random_horizontal_flip: 0.0
    random_vertical_flip: 0.0  # Added vertical flip
    color_jitter:
      brightness: 0.2  # Increased from 0.1
      contrast: 0.2  # Increased from 0.1
      saturation: 0.2  # Increased from 0.1
      hue: 0.1  # Increased from 0.05
    random_rotation: 10  # Degrees (reduced from 15 for speed)
    random_scale: null  # Disabled for performance (was [0.95, 1.05])
    random_blur: 0.2  # Probability (reduced from 0.3)
    blur_sigma_range: [0.1, 1.0]  # Blur strength range (reduced max)
    random_erasing: 0.1  # Probability (reduced from 0.2)
    erasing_scale: [0.02, 0.15]  # Scale of erased area
    erasing_ratio: [0.3, 3.3]  # Aspect ratio of erased area

logging:
  log_dir: "logs"
  experiment_name: "mask_model"
  
  use_tensorboard: true
  tensorboard_dir: "runs"
  
  log_every_n_steps: 10
  log_images_every_n_steps: 100
  num_images_to_log: 4

evaluation:
  batch_size: 64
  metrics:
    - "iou"
    - "f1"
    - "precision"
    - "recall"
    - "accuracy"
  threshold: 0.5  # Threshold for binary prediction

system:
  device: "cuda"  # cuda, cpu, or specific device like cuda:0
  seed: 42
  deterministic: false  # Set true for reproducibility (may impact performance)
  num_threads: 4  # Number of CPU threads for torch operations

